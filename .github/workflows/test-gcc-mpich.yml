# Subset CI: GNU + MPICH (CPU)
# Quick ECT validation with 4 MPI ranks.

name: "GNU+MPICH (CPU)"

on:
  workflow_dispatch:
  push:
    branches: [master, develop, 'feature/ci-cpu-testing']
  pull_request:
    branches: [master, develop, 'feature/ci-cpu-testing']

jobs:
  strategy:
      matrix:
        compiler: [ gcc oneapi nvhpc ]
        mpi: [ mpich openmpi ]
  test:
    uses: ./.github/workflows/_test-compiler.yml
    with:
      compiler: gcc
      mpi: mpich

